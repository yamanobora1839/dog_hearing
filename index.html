<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffaf2">
  <title>犬の耳体験</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>音の高さを変えて、犬の耳を体験してみよう！</h1>

    <section class="experience" aria-label="音の周波数体験">
      <div class="frequency-display" aria-live="polite">
        <span id="frequencyValue">10000</span>
        <span class="unit">Hz</span>
      </div>

      <div class="slider-area">
        <input
          id="frequencySlider"
          type="range"
          min="10"
          max="25000"
          step="1"
          value="10000"
          aria-label="音の周波数、10Hzから25,000Hz"
          aria-valuetext="10,000 Hz"
        >
        <div class="range-labels" aria-hidden="true">
          <span>低い音 <span id="minFrequencyLabel">10 Hz</span></span>
          <span><span id="maxFrequencyLabel">25,000 Hz</span> 高い音</span>
        </div>
      </div>

      <p id="frequencyExplanation" class="frequency-explanation" aria-live="polite"></p>

      <div class="controls">
        <button id="startButton" class="button button-start" type="button">音を鳴らす</button>
        <button id="stopButton" class="button button-stop" type="button" disabled>停止</button>
      </div>

      <p id="status" class="status" role="status">停止中</p>
    </section>

    <section class="hearing-guide" aria-labelledby="hearingTitle">
      <h2 id="hearingTitle">人間と犬の聞こえる範囲の目安</h2>
      <p class="guide-intro">横軸は0Hzから45,000Hzまでの線形目盛りです。</p>

      <div class="hearing-row">
        <span class="hearing-name">人間</span>
        <div class="hearing-track" role="img" aria-label="人間の一般的な可聴域の目安：約20Hzから20,000Hz。横軸は0Hzから45,000Hz">
          <span class="hearing-range human-range"></span>
        </div>
        <span class="hearing-value">約20Hz～20,000Hz</span>
      </div>
      <div class="hearing-row">
        <span class="hearing-name">犬</span>
        <div class="hearing-track" role="img" aria-label="犬の一般的な可聴域の目安：約65Hzから45,000Hz。横軸は0Hzから45,000Hz">
          <span class="hearing-range dog-range"></span>
        </div>
        <span class="hearing-value">約65Hz～45,000Hz</span>
      </div>
      <div class="scale-labels" aria-hidden="true">
        <span class="scale-start">0Hz</span>
        <span class="scale-middle">20,000Hz</span>
        <span class="scale-end">45,000Hz</span>
      </div>
      <p class="guide-note">※一般的な目安です。年齢、犬種、個体差や音の大きさによって異なります。また、スマートフォンのスピーカーでは再生できない周波数があります。</p>
    </section>

    <p class="device-note">
      音を生成する周波数と、スピーカーから実際に出る音は別です。機種によって、音が十分な大きさで再生されない場合があります。
    </p>
  </main>

  <script src="app.js"></script>
</body>
</html>
